version: "3.9"

services:
  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DEMO_MYSQL_DSN=mysql+pymysql://root:root@mysql-source:3306/demo
      - TARGET_MYSQL_DSN=mysql+pymysql://root:root@mysql-target:3306/migration_target
      - DEMO_MONGO_SRC_URI=mongodb://mongo:27017/demo_source
      - TARGET_MONGO_URI=mongodb://mongo:27017
      - TARGET_MONGO_DB=migration_target
    volumes:
      - ./backend:/app
    depends_on:
      mysql-source:
        condition: service_healthy
      mysql-target:
        condition: service_healthy
      mongo:
        condition: service_started
    networks:
      - schemashift

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - schemashift

  # ── MySQL source (seeded demo data) ─────────────────────────────────────────
  mysql-source:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo
    ports:
      - "3306:3306"
    volumes:
      - ./seed/sample_mysql_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./seed/sample_mysql_data.sql:/docker-entrypoint-initdb.d/02_data.sql
      - mysql_source_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - schemashift

  # ── MySQL target (empty, migration writes here) ──────────────────────────────
  mysql-target:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: migration_target
    ports:
      - "3307:3306"
    volumes:
      - mysql_target_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - schemashift

  # ── MongoDB (demo_source + migration_target databases) ───────────────────────
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - schemashift

  # ── Optional: Ollama (uncomment only if USE_LOCAL_LLM=true) ─────────────────
  # ollama:
  #   image: ollama/ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - schemashift

volumes:
  mysql_source_data:
  mysql_target_data:
  mongo_data:
  # ollama_data:

networks:
  schemashift:
    driver: bridge
