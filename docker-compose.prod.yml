name: schemashift-prod

services:
  # ── Frontend (Production Nginx serving React SPA + Reverse Proxy to Backend) ─
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_MYSQL_HOST_PORT: ${MYSQL_HOST_PORT:-3308}
        VITE_MONGO_HOST_PORT: ${MONGO_HOST_PORT:-27018}
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - schemashift

  # ── Backend (FastAPI Production Worker) ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SQLITE_DB_URL=sqlite:////app/data/app_metadata.db
      - DOCKER_DSN_REWRITE=true
    volumes:
      - backend_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started
    networks:
      - schemashift

  # ── Shared MySQL instance; source and target are selected by database name ──
  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_HOST_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - schemashift

  # ── Shared MongoDB instance; databases/collections are user-provided ────────
  mongo:
    image: mongo:7
    restart: always
    ports:
      - "${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - schemashift

volumes:
  backend_data:
  mysql_data:
  mongo_data:

networks:
  schemashift:
    driver: bridge

